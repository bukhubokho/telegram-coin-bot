# fly.toml — BENZ EX API
app = "benzex-api"
primary_region = "sin"

[build]

[env]
  PORT = "3000"
  DB_PATH = "/app/data/data.db"

[mounts]
  source = "benzex_data"
  destination = "/app/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
